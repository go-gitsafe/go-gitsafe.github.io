packages:
  - { name: "gitsafe", chip: "S", desc: "The git hooks, the Bash guard, the credential helper, the scope checkers and the push wrapper — plus the merge, release and create tools that act only on evidence (ghmerge refuses a Go change in a tagged module, root or nested, until ghrelease tags it), and a scanner that strips credentials out of remote URLs across a machine. Two read-side tools: guard-read refuses a Read or Bash call that would display a file holding a credential, judged by its content (JWT, PEM keys, GitHub, GitLab, AWS, Slack and Anthropic tokens, URL credentials, secret-keyed values), and secretpeek shows such a file's keys as classes, never values. 17 commands, one module, no cgo.", url: "https://github.com/go-gitsafe/gitsafe", doc: "https://pkg.go.dev/github.com/go-gitsafe/gitsafe" }
